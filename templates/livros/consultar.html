<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar - Consulta de livros cadastrados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/consultar.css' %}">
</head>
<body data-bs-theme="light">
    
    <!-- NAVBAR -->
     <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container">

            <a
                class="navbar-brand"
                href="../Tela_Inicial/index.html">

                <i class="bi bi-book"></i>

                Biblioteca Escolar

            </a>


            <div class="d-flex align-items-center text-white">

                <span
                    class="me-3"
                    id="nomeUsuario">

                    <i class="bi bi-person-circle"></i>

                    Usuário

                </span>


                <a
                    href="../Tela_Login/login.html"
                    class="btn btn-outline-light btn-sm">

                    <i class="bi bi-box-arrow-right"></i>

                    Sair

                </a>

            </div>

        </div>

    </nav>

    <!-- CONTEÚDO -->

    <main class="container py-5">

        <div class="add-container">


            <!-- CABEÇALHO -->

            <div class="add-header">

                <a
                    href="../Tela_Inicial/index.html"
                    class="btn btn-outline-secondary btn-voltar">

                    <i class="bi bi-arrow-left"></i>

                    Voltar

                </a>


                <h2>

                    Consultar Livro

                </h2>


                <p>

                    Consulte um livro cadastrado na biblioteca.

                </p>

            </div>

            <!-- PESQUISA -->

            <div class="card shadow border-0 mb-5">

            <div class="card-body">

            <h4 class="mb-3">

            <i class="bi bi-search"></i>

            Pesquisar Livro

            </h4>

            <div class="input-group">

            <input
            type="text"
            class="form-control pesquisa"
            id="pesquisa"
            placeholder="Digite o nome do livro...">

            <button
            class="btn btn-primary"
            onclick="pesquisarLivro()">

            Pesquisar

            </button>

            </div>

            </div>

            </div>

            <!--CARDS-->
            <div class="container-resultados">
                <p class="contador-resultados">Encontrados: <strong>2 livros</strong></p>

        <div class="grid-livros">
            <!-- Card 1: Disponível -->
        <div class="card-livro">
            <img src="https://m.media-amazon.com/images/I/81XpG2iKTlL.jpg" alt="Capa" class="capa-livro">
        <div class="info-livro">
            <span class="badge disponivel">Disponível</span>
            <h3 class="titulo-livro">Dom Casmurro</h3>
            <p class="autor-livro">Machado de Assis</p>
            <p class="meta-livro">Romance - 1899</p>
            <button class="btn-detalhes">Ver Detalhes</button>
        </div>
        </div>

            <!-- Card 2: Emprestado -->
        <div class="card-livro">
            <img src="https://m.media-amazon.com/images/I/51rf3O1fR1L._AC_UF1000,1000_QL80_.jpg" alt="Capa" class="capa-livro">
            <div class="info-livro">
                <span class="badge emprestado">Emprestado</span>
                <h3 class="titulo-livro">O Cortiço</h3>
                <p class="autor-livro">Aluísio Azevedo</p>
                <p class="meta-livro">Naturalismo - 1890</p>
                <button class="btn-detalhes">Ver Detalhes</button>
            </div>
        </div>
            </div>
            </div>
            
        </div>
    </main>

    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
