<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Adicionar Livro - Biblioteca Escolar</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS Global -->
    {% load static %}
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}">


    <!-- CSS da página -->

    <link
        rel="stylesheet"
        href="{% static 'css/add.css' %}">

</head>


<body class="bg-light">


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container">

            <a
                class="navbar-brand"
                href="../Tela_Inicial/index.html">

                <i class="bi bi-book"></i>

                Biblioteca Escolar

            </a>


            <div class="d-flex align-items-center text-white">

                <span
                    class="me-3"
                    id="nomeUsuario">

                    <i class="bi bi-person-circle"></i>

                    Usuário

                </span>


                <a
                    href="../Tela_Login/login.html"
                    class="btn btn-outline-light btn-sm">

                    <i class="bi bi-box-arrow-right"></i>

                    Sair

                </a>

            </div>

        </div>

    </nav>



    <!-- CONTEÚDO -->

    <main class="container py-5">

        <div class="add-container">


            <!-- CABEÇALHO -->

            <div class="add-header">

                <a
                    href="../Tela_Inicial/index.html"
                    class="btn btn-outline-secondary btn-voltar">

                    <i class="bi bi-arrow-left"></i>

                    Voltar

                </a>


                <h2>

                    Adicionar Livro

                </h2>


                <p>

                    Cadastre um novo livro na biblioteca.

                </p>

            </div>



            <!-- FORMULÁRIO -->

            <div class="form-card">


                <!-- CABEÇALHO -->

                <div class="form-card-header">

                    <i class="bi bi-book"></i>

                    <h5>
                        Dados do Livro
                    </h5>

                </div>



                <!-- CORPO -->

                <div class="form-card-body">

                    <form id="formLivro">


                        <div class="row g-4">


                            <!-- TÍTULO -->

                            <div class="col-md-8">

                                <label
                                    for="titulo"
                                    class="form-label">

                                    Título

                                </label>


                                <input
                                    type="text"
                                    class="form-control"
                                    id="titulo"
                                    placeholder="Digite o título do livro"
                                    required>

                            </div>



                            <!-- ANO -->

                            <div class="col-md-4">

                                <label
                                    for="ano"
                                    class="form-label">

                                    Ano de publicação

                                </label>


                                <input
                                    type="number"
                                    class="form-control"
                                    id="ano"
                                    placeholder="Ex.: 1899"
                                    min="0"
                                    max="2100"
                                    required>

                            </div>



                            <!-- AUTOR -->

                            <div class="col-md-6">

                                <label
                                    for="autor"
                                    class="form-label">

                                    Autor

                                </label>


                                <input
                                    type="text"
                                    class="form-control"
                                    id="autor"
                                    placeholder="Nome do autor"
                                    required>

                            </div>



                            <!-- EDITORA -->

                            <div class="col-md-6">

                                <label
                                    for="editora"
                                    class="form-label">

                                    Editora

                                </label>


                                <input
                                    type="text"
                                    class="form-control"
                                    id="editora"
                                    placeholder="Nome da editora"
                                    required>

                            </div>



                            <!-- ISBN -->

                            <div class="col-md-6">

                                <label
                                    for="isbn"
                                    class="form-label">

                                    ISBN

                                </label>


                                <input
                                    type="text"
                                    class="form-control"
                                    id="isbn"
                                    placeholder="Ex.: 978-85-00000-00-0">

                            </div>



                            <!-- CATEGORIA -->

                            <div class="col-md-6">

                                <label
                                    for="categoria"
                                    class="form-label">

                                    Categoria

                                </label>


                                <select
                                    class="form-select"
                                    id="categoria"
                                    required>

                                    <option
                                        value=""
                                        selected
                                        disabled>

                                        Selecione uma categoria

                                    </option>

                                    <option value="Literatura">
                                        Literatura
                                    </option>

                                    <option value="Romance">
                                        Romance
                                    </option>

                                    <option value="Ficção">
                                        Ficção
                                    </option>

                                    <option value="História">
                                        História
                                    </option>

                                    <option value="Ciência">
                                        Ciência
                                    </option>

                                    <option value="Tecnologia">
                                        Tecnologia
                                    </option>

                                    <option value="Didático">
                                        Didático
                                    </option>

                                    <option value="Outros">
                                        Outros
                                    </option>

                                </select>

                            </div>



                            <!-- QUANTIDADE -->

                            <div class="col-md-4">

                                <label
                                    for="quantidade"
                                    class="form-label">

                                    Quantidade

                                </label>


                                <input
                                    type="number"
                                    class="form-control"
                                    id="quantidade"
                                    value="1"
                                    min="1"
                                    required>

                            </div>



                            <!-- LOCALIZAÇÃO -->

                            <div class="col-md-8">

                                <label
                                    for="localizacao"
                                    class="form-label">

                                    Localização

                                </label>


                                <input
                                    type="text"
                                    class="form-control"
                                    id="localizacao"
                                    placeholder="Ex.: Estante A - Prateleira 2">

                            </div>



                            <!-- DESCRIÇÃO -->

                            <div class="col-12">

                                <label
                                    for="descricao"
                                    class="form-label">

                                    Descrição

                                </label>


                                <textarea
                                    class="form-control"
                                    id="descricao"
                                    rows="4"
                                    placeholder="Digite uma breve descrição do livro"></textarea>

                            </div>

                        </div>



                        <!-- BOTÕES -->

                        <div class="form-actions">


                            <a
                                href="../Tela_Inicial/index.html"
                                class="btn btn-outline-secondary">

                                <i class="bi bi-x-circle"></i>

                                Cancelar

                            </a>


                            <button
                                type="reset"
                                class="btn btn-outline-danger">

                                <i class="bi bi-eraser"></i>

                                Limpar

                            </button>


                            <button
                                type="submit"
                                class="btn btn-cadastrar">

                                <i class="bi bi-check-circle"></i>

                                Cadastrar Livro

                            </button>

                        </div>

                    </form>

                </div>

            </div>



            <!-- MENSAGEM -->

            <div
                id="mensagem"
                class="alert d-none mt-4">

            </div>

        </div>

    </main>


    <script src="../js/add.js"></script>

</body>

</html>
